packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/client": true
  "@prisma/engines": true
  "@tailwindcss/oxide": true
  argon2: true
  better-sqlite3: true
  core-js: false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - fumadocs-core@16.11.2
  - fumadocs-ui@16.11.2
